[project]
name = "ayato-reporter"
version = "1.3.0"
description = "AI News Reporter with Hybrid Intelligence"
authors = [{ name = "Ayato Team" }]
dependencies = [
    "google-genai==1.61.0",
    "google-cloud-tasks==2.21.0",
    "google-cloud-secret-manager==2.23.0",
    "requests==2.32.5",
    "flask==3.1.2",
    "gunicorn==25.0.1",
    "pygithub==2.8.1",
    "python-dotenv==1.2.1",
    "tweepy==4.16.0",
    "atproto==0.0.65",
    "jinja2==3.1.6",
    "python-dateutil==2.9.0.post0",
    "markdown==3.10.1",
    "pyyaml==6.0.3",
    "supabase==2.13.0",
    "asgiref>=3.7.0",
    "beautifulsoup4==4.13.3",
    "lxml==5.3.1",
    "pdfminer.six==20240706",
    "loguru>=0.7.3",
]
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "ruff==0.9.9",
    "pytest<9.0",
    "pytest-asyncio>=0.23.0",
]

[tool.ruff]
# Target version for Python
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: isort (import sorting)
# UP: pyupgrade
# B: flake8-bugbear (common bugs)
# S: flake8-security
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["E402", "E501", "S101", "S104", "S110", "S113", "S310", "S311", "S314"]

# Exclude specific directories
exclude = [
    ".git",
    ".venv",
    ".gemini",
    "scratch",
    "__pycache__",
    "build",
    "dist",
    "data/logs",
    "content/reports",
]

# Allow unused variables when underscore-prefixed
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.setuptools]
py-modules = ["main", "local_runner", "main_cloud"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "plugins*", "config*"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

