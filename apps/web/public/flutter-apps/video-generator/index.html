<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AI Video Generator - Ayato Studio</title>
  <style>
    body {
      background-color: #050505;
      color: #ffffff;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(6, 182, 212, 0.15);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .text {
      margin-top: 16px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.2em;
      color: #06b6d4;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <div class="text">Ayato Studio // Syncing Wasm Binaries</div>
</body>
</html>
